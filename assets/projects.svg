ss and academic</text><text x="486" y="188" font-size="15" fill="#D1D1D6">analytics.</text><circle cx="491" cy="218" r="3" fill="#BF5AF2"/><text x="506" y="223" font-size="14" fill="#A1A1A6">OOP principles with Collections (ArrayList,</text><text x="506" y="242" font-size="14" fill="#A1A1A6">HashMap) for fast lookup</text><circle cx="491" cy="265" r="3" fill="#BF5AF2"/><text x="506" y="270" font-size="14" fill="#A1A1A6">SQL JOINs, GROUP BY and indexing for query</text><text x="506" y="289" font-size="14" fill="#A1A1A6">optimization</text><circle cx="491" cy="312" r="3" fill="#BF5AF2"/><text x="506" y="317" font-size="14" fill="#A1A1A6">Custom exceptions, validation and a layered</text><text x="506" y="336" font-size="14" fill="#A1A1A6">SOLID architecture</text><rect x="486" y="364" width="52" height="26" rx="13" fill="#BF5AF2" fill-opacity="0.13" stroke="#BF5AF2" stroke-opacity="0.35"/><text x="512" y="381.5" font-size="12" font-weight="600" fill="#BF5AF2" text-anchor="middle">Java</text><rect x="543.84" y="364" width="45" height="26" rx="13" fill="#BF5AF2" fill-opacity="0.13" stroke="#BF5AF2" stroke-opacity="0.35"/><text x="566" y="381.5" font-size="12" font-weight="600" fill="#BF5AF2" text-anchor="middle">OOP</text><rect x="594.72" y="364" width="45" height="26" rx="13" fill="#BF5AF2" fill-opacity="0.13" stroke="#BF5AF2" stroke-opacity="0.35"/><text x="617" y="381.5" font-size="12" font-weight="600" fill="#BF5AF2" text-anchor="middle">SQL</text><rect x="645.6" y="364" width="101" height="26" rx="13" fill="#BF5AF2" fill-opacity="0.13" stroke="#BF5AF2" stroke-opacity="0.35"/><text x="696" y="381.5" font-size="12" font-weight="600" fill="#BF5AF2" text-anchor="middle">Collections</text><rect x="752.16" y="364" width="59" height="26" rx="13" fill="#BF5AF2" fill-opacity="0.13" stroke="#BF5AF2" stroke-opacity="0.35"/><text x="782" y="381.5" font-size="12" font-weight="600" fill="#BF5AF2" text-anchor="middle">SOLID</text></g></g></svg>